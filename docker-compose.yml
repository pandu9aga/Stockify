services:
  # 1. Database PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: stockify_postgres
    restart: always
    environment:
      POSTGRES_DB: stockify_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Database GUI Web
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stockify_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stockify.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres-db

  # 3. AI / ML Microservice (PyTorch + FastAPI)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: stockify_ml
    restart: always
    ports:
      - "8000:8000"

  # 4. Backend ASP.NET Core API (.NET 10)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockify_api
    restart: always
    depends_on:
      - postgres-db
      - ml-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=stockify_db;Username=postgres;Password=postgrespassword
      - Jwt__Key=StockifySuperSecretDevelopmentKey1234567890!@#$%
      - Jwt__Issuer=StockifyApi
      - Jwt__Audience=StockifyClient
      - MlService__BaseUrl=http://ml-service:8000
    ports:
      - "5000:8080"

  # 5. Frontend Web App (React + Vite + Nginx)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockify_web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
